services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gapbook
      POSTGRES_PASSWORD: gapbook
      POSTGRES_DB: gapbook
    ports:
      - "5432:5432"
    volumes:
      - gapbook_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gapbook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gapbook_pg:
